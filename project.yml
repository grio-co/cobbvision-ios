name: CobbVisionCompanion
options:
  bundleIdPrefix: com.cobbvision
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Release
  xcodeVersion: "15"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CobbVisionCompanion:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cobbvision.companion
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""   # set your Apple Team ID here
    # No `info:` block on purpose: XcodeGen *generates* (overwrites) the file
    # named there, which wiped the NSLocation* usage strings and the
    # UIBackgroundModes/location entry from Resources/Info.plist and made the
    # app abort at launch (CoreLocation asserts when
    # allowsBackgroundLocationUpdates is set without the background mode).
    # INFOPLIST_FILE above points at the committed plist instead.
    entitlements:
      path: Resources/CobbVisionCompanion.entitlements

  CobbVisionCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/CobbVisionCompanionTests
    dependencies:
      - target: CobbVisionCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cobbvision.companion.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  CobbVisionCompanion:
    build:
      targets:
        CobbVisionCompanion: all
        CobbVisionCompanionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CobbVisionCompanionTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

# Generate with: brew install xcodegen && xcodegen generate
